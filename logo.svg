<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowInner" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="rayBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Solid Background for visibility on light themes -->
  <circle cx="256" cy="256" r="250" fill="black"/>

  <!-- Large diffuse atmosphere -->
  <circle cx="256" cy="256" r="220" fill="url(#glowOuter)" filter="url(#heavyBlur)" opacity="0.4"/>

  <!-- Detailed Wispy Corona Rays -->
  <g filter="url(#rayBlur)" opacity="0.6">
    <!-- Left-side wisps -->
    <path d="M256 256 L50 200 C80 230 80 280 50 312 Z" fill="white" opacity="0.4"/>
    <path d="M256 256 L80 180 C110 210 110 300 80 332 Z" fill="white" opacity="0.3"/>
    <path d="M256 256 L20 256 C50 240 50 272 20 256 Z" fill="white" opacity="0.5"/>

    <!-- Right-side wisps -->
    <path d="M256 256 L462 200 C432 230 432 280 462 312 Z" fill="white" opacity="0.4"/>
    <path d="M256 256 L432 180 C402 210 402 300 432 332 Z" fill="white" opacity="0.3"/>
    <path d="M256 256 L492 256 C462 240 462 272 492 256 Z" fill="white" opacity="0.5"/>

    <!-- Top/Bottom shorter wisps -->
    <path d="M256 256 L200 80 C230 110 280 110 312 80 Z" fill="white" opacity="0.3"/>
    <path d="M256 256 L200 432 C230 402 280 402 312 432 Z" fill="white" opacity="0.3"/>

    <!-- Fine Ray Detail -->
    <path d="M256 256 L150 150 L160 160 Z" fill="white" opacity="0.2"/>
    <path d="M256 256 L362 362 L352 352 Z" fill="white" opacity="0.2"/>
    <path d="M256 256 L150 362 L160 352 Z" fill="white" opacity="0.2"/>
    <path d="M256 256 L362 150 L352 160 Z" fill="white" opacity="0.2"/>
  </g>

  <!-- Intense inner corona ring -->
  <circle cx="256" cy="256" r="132" fill="url(#glowInner)" filter="url(#softBlur)"/>
  <circle cx="256" cy="256" r="128" stroke="white" stroke-width="2" opacity="0.8"/>

  <!-- The Moon -->
  <circle cx="256" cy="256" r="124" fill="black"/>
</svg>
